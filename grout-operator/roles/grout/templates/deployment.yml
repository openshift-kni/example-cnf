kind: Deployment
apiVersion: apps/v1
metadata:
  name: "{{ ansible_operator_meta.name }}-app"
  namespace: "{{ ansible_operator_meta.namespace }}"
spec:
  replicas: {{ size | int }}
  selector:
    matchLabels:
      example-cnf-type: cnf-app
      restart-on-reboot: "true"
  template:
    metadata:
{% if not skip_annot|bool %}
      annotations:
        certsuite.redhat.com/non-tls-ports: "8095,8096,9111"
{% if runtime_class_name is defined and runtime_class_name | length %}
        irq-load-balancing.crio.io: "disable"
        cpu-load-balancing.crio.io: "disable"
{% endif %}
        # TODO: Probably to be readapted once we use multiple pods for load-balancing
        k8s.v1.cni.cncf.io/networks: '[
{% for network in networks %}
{% set outer_loop = loop %}
{% for count in range(network.count) %}
          {
            "name": "{{ network.name }}",
{% if network.mac|default([])|length == network.count %}
            "mac": "{{ network.mac[loop.index - 1] }}",
{% endif %}
{% if network.ip|default([])|length == network.count and network.ip[loop.index - 1]|length > 0 %}
            "ips": ["{{ network.ip[loop.index - 1] }}"],
{% endif %}
            "namespace": "{{ ansible_operator_meta.namespace }}"
          }{% if loop.index < network.count or outer_loop.index < network_name_list|length %},{% endif %}
{% endfor %}
{% endfor %}
        ]'
{% endif %}
      labels:
        example-cnf-type: cnf-app
        restart-on-reboot: "true"
    spec:
{% if deployment_type == "multi-node" %}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: example-cnf-type
                operator: In
                values:
                - pkt-gen
            topologyKey: kubernetes.io/hostname
{% endif %}
      securityContext:
        runAsNonRoot: true
        runAsUser: 56560
      serviceAccountName: grout-account
{% if runtime_class_name is defined and runtime_class_name | length %}
      runtimeClassName: "{{ runtime_class_name }}"
{% endif %}
      initContainers:
      - name: grout-init
        args: ["generate-grout-config"]
        image: "{{ image_grout }}"
        imagePullPolicy: "{{ image_pull_policy }}"
        resources:
          requests:
{% for key, value in network_resources.items() %}
            {{ key }}: {{ value }}
{% endfor %}
          limits:
{% for key, value in network_resources.items() %}
            {{ key }}: {{ value }}
{% endfor %}
        securityContext:
          runAsNonRoot: true
          runAsUser: 56560
        volumeMounts:
        - name: grout-cfg
          mountPath: /run/grout/cfg
        - name: podnetinfo
          mountPath: /etc/podnetinfo
          readOnly: true
        env:
        - name: NETWORK_NAME_LIST
          value: "{{ network_resources.keys()|list|join(',') }}"
          # "openshift.io/example_cnf_res1,openshift.io/example_cnf_res2"
        - name: rx_queues
          value: "{{ rx_queues }}"
      - name: frr-init
        args: ["generate-frr-config"]
        image: "{{ image_grout }}"
        imagePullPolicy: "{{ image_pull_policy }}"
        securityContext:
          runAsNonRoot: true
          runAsUser: 56560
        volumeMounts:
        - name: frr-cfg
          mountPath: /run/frr/cfg
      containers:
      - name: grout
        args: ["grout"]
        image: "{{ image_grout }}"
        imagePullPolicy: "{{ image_pull_policy }}"
        ports:
        - name: "http-probe"
          containerPort: 8095
        - name: "tcp-gr-svc"
          containerPort: 9111
        resources:
          limits:
            hugepages-1Gi: {{ hugepage_1gb_count }}
            memory: {{ memory }}
            cpu: {{ cpu }}
{% for key, value in network_resources.items() %}
            {{ key }}: {{ value }}
{% endfor %}
          requests:
            hugepages-1Gi: {{ hugepage_1gb_count }}
            memory: {{ memory }}
            cpu: {{ cpu }}
{% for key, value in network_resources.items() %}
            {{ key }}: {{ value }}
{% endfor %}
        securityContext:
          runAsNonRoot: true
          runAsUser: 56560
{% if run_deployment is defined and run_deployment == 1 %}
          readOnlyRootFilesystem: true
{% endif %}
          privileged: true
        volumeMounts:
        - name: hugepage
          mountPath: /dev/hugepages
        - name: log-dir
          mountPath: /var/log/grout
        - name: grout-run
          mountPath: /run/grout
        - name: grout-cfg
          mountPath: /etc/grout.init
          subPath: grout.init
        - name: dpdk-dir
          mountPath: /run/dpdk
        - name: tmp
          mountPath: /tmp
        - name: tun
          mountPath: /dev/net/tun
        env:
        - name: GROUT_SOCK_PATH
          value: "/run/grout/api.sock"
        - name: GROUT_OVERRIDE_DEFAULT_ROUTE
          value: "true"
        - name: GROUT_OVERRIDE_RP_FILTER
          value: "true"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
{% if run_deployment is defined %}
        - name: run_deployment
          value: "{{ run_deployment }}"
{% endif %}
{% for key, value in environments.items() %}
        - name: {{ key }}
          value: "{{ value }}"
{% endfor %}
{% if run_deployment is defined and run_deployment == 1 %}
        lifecycle:
          postStart:
            exec:
              command: ["/grout-wrapper", "poststart-grout"]
          preStop:
            exec:
              command: ["/bin/sh", "-c", "echo Hello from the preStop handler"]
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8095
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8095
          initialDelaySeconds: 5
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /startz
            port: 8095
          initialDelaySeconds: 30
          periodSeconds: 10
{% endif %}
        terminationMessagePolicy: FallbackToLogsOnError
      - name: frr
        args: ["frr"]
        image: "{{ image_grout }}"
        imagePullPolicy: "{{ image_pull_policy }}"
        ports:
        - name: "http-probe"
          containerPort: 8096
        resources:
          limits:
            memory: {{ memory }}
            cpu: {{ cpu }}
          requests:
            memory: {{ memory }}
            cpu: {{ cpu }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 56560
{% if run_deployment is defined and run_deployment == 1 %}
          readOnlyRootFilesystem: true
{% endif %}
{% if privileged %}
          privileged: true
{% else %}
          capabilities:
            add: ["NET_ADMIN", "AUDIT_WRITE", "NET_RAW", "NET_BIND_SERVICE", "SYS_ADMIN"]
          seLinuxOptions:
            type: spc_t
{% endif %}
        volumeMounts:
        - name: log-dir
          mountPath: /var/log/grout
        - name: log-tmp-dir-frr
          mountPath: /var/tmp/frr
        - name: frr-cfg
          mountPath: /etc/frr/daemons
          subPath: daemons
        - name: frr-cfg
          mountPath: /etc/frr/frr.conf
          subPath: frr.conf
        - name: run-dir-frr
          mountPath: /run/frr
        - name: grout-run
          mountPath: /run/grout
        - name: tmp
          mountPath: /tmp
        env:
        - name: GROUT_SOCK_PATH
          value: "/run/grout/api.sock"
{% if run_deployment is defined and run_deployment == 1 %}
        lifecycle:
          postStart:
            exec:
              command: ["/grout-wrapper", "poststart-frr"]
          preStop:
            exec:
              command: ["/bin/sh", "-c", "echo Hello from the preStop handler"]
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8096
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8096
          initialDelaySeconds: 5
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /startz
            port: 8096
          initialDelaySeconds: 30
          periodSeconds: 10
{% endif %}
        terminationMessagePolicy: FallbackToLogsOnError
      volumes:
      - name: hugepage
        emptyDir:
          medium: HugePages
      - name: log-dir
        emptyDir: {}
      - name: log-tmp-dir-frr
        emptyDir: {}
      - name: run-dir-frr
        emptyDir: {}
      - name: grout-run
        emptyDir: {}
      - name: grout-cfg
        emptyDir: {}
      - name: frr-cfg
        emptyDir: {}
      - name: dpdk-dir
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
